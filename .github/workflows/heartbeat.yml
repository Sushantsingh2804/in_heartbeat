name: HeartbeatIN Bot

on:
  schedule:
    - cron: "30 3 * * *"    # 9:00 AM IST  — morning tweet
    - cron: "30 7 * * *"    # 1:00 PM IST  — afternoon tweet
    - cron: "0 13 * * *"    # 6:30 PM IST  — reply bot
    - cron: "30 13 * * *"   # 7:00 PM IST  — evening thread
  workflow_dispatch:          # lets you trigger manually from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic tweepy python-dotenv

      - name: Create .env file
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "TWITTER_CLIENT_ID=${{ secrets.TWITTER_CLIENT_ID }}" >> .env
          echo "TWITTER_CLIENT_SECRET=${{ secrets.TWITTER_CLIENT_SECRET }}" >> .env
          echo "TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}" >> .env
          echo "TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}" >> .env

      - name: Morning tweet
        if: github.event.schedule == '30 3 * * *' 
        run: python3 bot.py morning

      - name: Afternoon tweet
        if: github.event.schedule == '30 7 * * *'
        run: python3 bot.py afternoon

      - name: Reply bot
        if: github.event.schedule == '0 13 * * *'
        run: python3 reply_bot.py

      - name: Evening thread
        if: github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch'
        run: python3 bot.py evening