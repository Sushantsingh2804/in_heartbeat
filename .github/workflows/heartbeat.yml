name: HeartbeatIN Bot

on:
  schedule:
    - cron: "30 9 * * *"    # 9:30 AM IST  — morning tweet
    - cron: "0 13 * * *"    # 1:00 PM IST  — afternoon tweet
    - cron: "0 19 * * *"    # 7:00 PM IST  — evening thread
  timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - evening

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic tweepy python-dotenv

      - name: Create .env file
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "TWITTER_CLIENT_ID=${{ secrets.TWITTER_CLIENT_ID }}" >> .env
          echo "TWITTER_CLIENT_SECRET=${{ secrets.TWITTER_CLIENT_SECRET }}" >> .env
          echo "TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}" >> .env
          echo "TWITTER_ACCESS_TOKEN_SECRET=${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}" >> .env
          echo "TWITTER_BEARER_TOKEN=${{ secrets.TWITTER_BEARER_TOKEN }}" >> .env

      - name: Run scheduled slot
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ="Asia/Kolkata" date +%H)
          echo "IST hour: $HOUR"
          if [ "$HOUR" = "09" ]; then
            echo "▶ Running morning tweet"
            python3 bot.py morning
          elif [ "$HOUR" = "13" ]; then
            echo "▶ Running afternoon tweet"
            python3 bot.py afternoon
          elif [ "$HOUR" = "19" ]; then
            echo "▶ Running evening thread"
            python3 bot.py evening
          else
            echo "⚠️ Unexpected hour $HOUR — skipping"
          fi

      - name: Run manual slot
        if: github.event_name == 'workflow_dispatch'
        run: python3 bot.py ${{ inputs.slot }}